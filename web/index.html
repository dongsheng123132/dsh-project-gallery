<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目相册 · 会话图片与进展</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mode="full">
    <div id="app" class="app">
      <aside class="rail" id="rail">
        <div class="rail-head">
          <span class="rail-title">项目相册</span>
          <span class="rail-sub" id="rail-sub"></span>
        </div>
        <div class="rail-scope" id="rail-scope">
          <button class="rail-scope-item" data-scope="all">全部图片</button>
          <button class="rail-scope-item" data-scope="recent">最近 7 天</button>
          <button class="rail-scope-item" data-scope="todo">有未完成待办</button>
        </div>
        <div class="rail-section">按项目</div>
        <div class="rail-list" id="rail-list"></div>
        <div class="rail-foot" id="rail-foot"></div>
      </aside>

      <main class="main">
        <header class="toolbar">
          <div class="tb-main">
            <h1 class="tb-title" id="tb-title">全部图片</h1>
            <div class="tb-chips" id="tb-chips"></div>
            <div class="tb-progress" id="tb-progress" hidden>
              <b class="tb-progress-track"><i id="tb-progress-bar"></i></b><span id="tb-progress-text"></span>
            </div>
          </div>
          <div class="tb-side">
            <div class="seg seg-dim" id="seg-dim" title="看哪个范围：本次对话 / 当前项目 / 全部项目">
              <button class="seg-item" data-dim="session" title="只显示本次对话里出现过的图">本次对话</button>
              <button class="seg-item" data-dim="workspace" title="当前项目目录里 AI 看过的图 + 目录里的图">当前项目</button>
              <button class="seg-item" data-dim="all" title="所有项目的最新图片（按天分组）">全部项目</button>
            </div>
            <div class="seg" id="seg-view" hidden title="全部项目时切换：按天网格 / 按项目看板">
              <button class="seg-item is-on" data-view="grid">网格</button>
              <button class="seg-item" data-view="board">看板</button>
            </div>
            <div class="seg" id="seg" title="按来源筛：AI 会话里出现过的图 / 项目目录里的图">
              <button class="seg-item is-on" data-kind="all">全部</button>
              <button class="seg-item" data-kind="session">会话图</button>
              <button class="seg-item" data-kind="file" title="项目目录里的图：限深 3 层、跳过 node_modules/.git/dist、近 240 天、单张 ≤30MB（不是全盘搜索）">项目目录</button>
            </div>
            <input class="search" id="search" type="search" placeholder="搜文件名 / 会话标题" spellcheck="false" />
            <button class="icon-btn" id="refresh" title="重建索引">↻</button>
            <button class="icon-btn" id="open-right" title="停靠到右侧栏">⇥</button>
            <button class="icon-btn" id="dock-close" title="关闭 (Esc)" hidden>✕</button>
          </div>
        </header>
        <section class="grid-wrap" id="grid-wrap">
          <div class="empty" id="empty" hidden></div>
        </section>
      </main>
    </div>

    <div class="lb" id="lb" hidden>
      <div class="lb-bar">
        <div class="lb-bar-main">
          <span class="lb-project" id="lb-project"></span>
          <span class="lb-session" id="lb-session"></span>
        </div>
        <div class="lb-bar-side">
          <span class="lb-counter" id="lb-counter"></span>
          <button class="icon-btn" id="lb-close" title="关闭 (Esc)">✕</button>
        </div>
      </div>

      <div class="lb-body">
        <button class="lb-nav lb-prev" id="lb-prev" title="上一张 (←)">‹</button>
        <div class="lb-stage" id="lb-stage"><img class="lb-img" id="lb-img" alt="" /></div>
        <button class="lb-nav lb-next" id="lb-next" title="下一张 (→)">›</button>
        <aside class="lb-info">
          <div class="lb-info-block">
            <div class="lb-kicker">当时在做什么</div>
            <p class="lb-prompt" id="lb-prompt"></p>
          </div>
          <dl class="lb-meta" id="lb-meta"></dl>
          <div class="lb-actions" id="lb-actions"></div>
        </aside>
      </div>

      <div class="lb-strip" id="lb-strip"></div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
